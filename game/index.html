<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>三国沙盘 · 战略原型</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1E1710; overflow: hidden; }
  body { font-family: "Noto Serif CJK SC", "Songti SC", "SimSun", serif; }
  #game-root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game-root canvas { display: block; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #rotate-mask {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: #1E1710; color: #E8C56A;
    align-items: center; justify-content: center; flex-direction: column;
    font-size: 22px; letter-spacing: 2px; text-align: center;
  }
  #rotate-mask small { display: block; margin-top: 14px; font-size: 14px; color: #8C7A52; letter-spacing: 0; }
  @media (orientation: portrait) {
    #rotate-mask .hint { display: block; }
  }
</style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate-mask">
    <div>请旋转设备至横屏</div>
    <small>本游戏为 1280×720 横屏设计（rea 取证：screenType = L）</small>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script src="src/theme.js"></script>
  <script src="src/data.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/state.js"></script>
  <script src="src/ui/widgets.js"></script>
  <script src="src/ui/Hud.js"></script>
  <script src="src/ui/CityPanel.js"></script>
  <script src="src/ui/HeroPanel.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/TitleScene.js"></script>
  <script src="src/scenes/MapScene.js"></script>
  <script src="src/scenes/BattleScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
